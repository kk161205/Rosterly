version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rosterly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosterly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosterly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rosterly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rosterly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rosterly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rosterly-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker — background jobs: depreciation (nightly), warranty/AMC expiry (daily),
  # email dispatch (short interval). See ROSTERLY_PROJECT_DOCUMENTATION.md §6.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rosterly-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rosterly-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - worker
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rosterly-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: rosterly-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    depends_on:
      - backend
    ports:
      - "8100:8100"
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload

volumes:
  postgres_data:
