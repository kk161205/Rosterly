# Render Blueprint for the Rosterly API (README, Deployment).
# The frontend is deployed separately on Vercel (frontend/vercel.json); the
# database is Neon (set DATABASE_URL by hand — it is never committed).
# Every service runs in Singapore, next to the Neon database (ap-southeast-1):
# a page makes many queries, and each one would cross the Pacific from Oregon.
services:
  - type: web
    name: rosterly-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CORS_ORIGINS
        sync: false # the Vercel address, e.g. https://rosterly.vercel.app
      - key: FRONTEND_BASE_URL
        sync: false # the same Vercel address
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: rosterly-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: rosterly-queue
          property: connectionString
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      # Render sits behind Cloudflare, which sets CF-Connecting-IP to the visitor's address
      # (overwriting any value a visitor sends). X-Forwarded-For isn't usable here: Render's
      # proxy appends to it without clearing it, and its right-most entry is an internal 10.x hop.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Fallback only, if the header above is ever missing.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  # The AI service: middleware with no database. It reads
  # only through the API above, with each person's own token.
  - type: web
    name: rosterly-ai
    runtime: python
    region: singapore
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false # from console.groq.com — never committed
      - key: CORE_BACKEND_BASE_URL
        sync: false # the rosterly-api address + /api/v1
      - key: CORS_ORIGINS
        sync: false # the Vercel address

  - type: keyvalue
    name: rosterly-queue
    region: singapore
    plan: free
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: noeviction # a job queue must never drop queued jobs
